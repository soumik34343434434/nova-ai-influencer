name: NOVA daily content cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # 09:30 IST

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Generate daily content
        env:
          MOCK_LLM: "true"
          APPROVAL_REQUIRED: "true"
        run: python -m app.workers.daily_cycle
